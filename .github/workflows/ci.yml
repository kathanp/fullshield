name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore

      - name: Upload SARIF report (produced from Phase 6 onward)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sarif-${{ matrix.os }}-node${{ matrix.node }}
          path: '**/*.sarif'
          if-no-files-found: ignore

  bench:
    name: bench
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run bench:public

      - name: Upload BENCHMARK.md
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BENCHMARK.md
          path: BENCHMARK.md
          if-no-files-found: ignore
