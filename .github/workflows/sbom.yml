name: SBOM

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  sbom:
    name: cyclonedx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node dist/cli/index.js sbom --out fullshield.cdx.json

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" fullshield.cdx.json --clobber
