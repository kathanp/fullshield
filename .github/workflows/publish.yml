name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm CLI 11.15.0+ for staging and trusted publishing
        run: npm install -g npm@12.2.0

      - run: npm ci

      # Do not set registry-url / NODE_AUTH_TOKEN: setup-node would write an empty
      # _authToken and npm would skip OIDC trusted publishing (E403).
      - name: Probe npm OIDC (print registry error body)
        run: node scripts/npm-oidc-diagnose.mjs

      - name: Verify
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify

      - name: Semver check
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/semver-check.mjs

      - name: Pack budget
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/pack-budget.mjs

      - name: Build
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build

      - name: Write CycloneDX SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        run: node dist/cli/index.js sbom --format cyclonedx --out sbom.json

      - name: Sign SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FULLSHIELD_EXPERIMENTAL_RELEASESIGN: "1"
          SBOM_SIGN_KEY: ${{ secrets.SBOM_SIGN_KEY }}
        run: node scripts/phase493-releasesign.mjs --sbom-sign --sbom sbom.json --out sbom.json.sig

      # Direct `npm publish` is 403 on this package (2FA staged approval).
      # Staging without provenance is forbidden after 0.1.3.
      - name: Stage with provenance (OIDC, no token)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/npm-stage-publish.mjs

      - name: Provenance gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/provenance-gate.mjs
