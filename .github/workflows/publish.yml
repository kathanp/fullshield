name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm CLI 11.15.0+ for staging and trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run verify

      # Do not set registry-url / NODE_AUTH_TOKEN: setup-node would write an empty
      # _authToken and npm would skip OIDC trusted publishing (E403).
      # Direct `npm publish` is rejected (E403) even with a valid OIDC identity;
      # npm 2026 requires a maintainer 2FA approval before a version goes live.
      - name: Stage with provenance (OIDC, no token)
        run: npm stage publish --provenance --access public
