name: False positive
description: FullShield flagged something that is not a real issue
title: '[fp] '
labels: ['false-positive']
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: SAST-SQLI-001
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this is not a vulnerability
      description: What sanitizer, framework guarantee, or context did we miss?
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Snippet (redacted)
      description: Smallest code that reproduces the finding. No real secrets.
    validations:
      required: true
