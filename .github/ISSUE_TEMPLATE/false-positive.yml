name: False positive
description: FullShield flagged something that is not a real issue
title: '[fp] '
labels: ['false-positive']
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: SAST-SQLI-001
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code
      description: Smallest code that reproduces the finding. No real secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `fullshield --version`.
      placeholder: 0.4.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected instead, including any sanitizer, framework guarantee, or context that was missed.
    validations:
      required: true
