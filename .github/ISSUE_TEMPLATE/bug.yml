name: Bug
description: A crash, wrong exit code, or broken command
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: FullShield version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
