name: Bug
description: Something FullShield does wrong (crash, wrong CLI, broken report)
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        For a wrong finding, use the False positive template. For a missed vulnerability, use the False negative template. For a vulnerability in FullShield itself, follow SECURITY.md and do not open a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `fullshield --version`.
      placeholder: 0.4.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, and what you expected versus what happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a tiny fixture. Do not paste real secrets.
    validations:
      required: true
