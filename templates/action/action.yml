name: FullShield
description: Scan a Node.js repository with fullshield, cache the baseline, and upload SARIF.
inputs:
  version:
    description: fullshield version to install
    required: false
    default: '0.4.0'
  fail-on:
    description: Minimum severity that fails the job
    required: false
    default: high
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install pinned fullshield
      shell: bash
      run: npm install -g fullshield@${{ inputs.version }}
    - name: Restore baseline
      uses: actions/cache@v4
      with:
        path: .fullshield-baseline.json
        key: fullshield-baseline-${{ hashFiles('package-lock.json') }}
    - name: Scan
      shell: bash
      run: fullshield scan --sarif fullshield.sarif --fail-on ${{ inputs.fail-on }}
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: fullshield.sarif
