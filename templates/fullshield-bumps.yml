name: FullShield bumps
on:
  schedule:
    - cron: '0 7 * * *'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: npx fullshield@3.5.3 bumps plan --from .fullshield/last-scan.json
        env:
          FULLSHIELD_EXPERIMENTAL_BUMP_PR: '1'
      - run: npx fullshield@3.5.3 bumps open --from .fullshield/last-scan.json
        env:
          FULLSHIELD_EXPERIMENTAL_BUMP_PR: '1'
