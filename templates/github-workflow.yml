name: FullShield
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .fullshield-baseline.json
          key: fullshield-baseline-${{ hashFiles('package-lock.json') }}
      - run: npx fullshield@0.4.0 scan --sarif fullshield.sarif --fail-on high
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: fullshield.sarif
