name: FullShield diff
on:
  pull_request:
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npx fullshield@3.3.2 scan --diff
        env:
          FULLSHIELD_EXPERIMENTAL_DIFFSCAN: '1'
