name: FullShield watch
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx fullshield watch --fail-on high
